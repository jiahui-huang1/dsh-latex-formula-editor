name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Read version
        id: meta
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Skip when this version is already on npm
        id: check
        run: |
          set +e
          PUBLISHED=$(npm view "$(node -p "require('./package.json').name")@${{ steps.meta.outputs.version }}" version 2>/dev/null)
          if [ -n "$PUBLISHED" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::version ${{ steps.meta.outputs.version }} already published, skipping"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Syntax gate
        if: steps.check.outputs.exists == 'false'
        run: |
          for f in index.js client.js lib/*.js; do node --check "$f"; done

      - name: Publish to npm
        if: steps.check.outputs.exists == 'false'
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: GitHub release
        if: steps.check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
